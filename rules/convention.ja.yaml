rules:
  CSS-NAMING-001:
    title: クラス名は全小文字・ハイフン区切り（kebab-case）
    summary: >-
      クラス名は kebab-case で書く。snake_case・camelCase・大文字始まりは禁止。
      接頭辞部分に限り特殊事情（Angular等）で camelCase を許容。
    rationale: 記法を1つに固定し、命名で「迷う・考える」コストを排除するため。
    aiGuidance: >-
      新規クラスは全小文字ハイフン区切りで命名する。アンダースコアや大文字を使わない。
      `.g-` / `.x-` / `.mode-` 接頭辞クラスもこの kebab-case 形式に従う。

  CSS-NAMING-002:
    title: クラス名は役割・意味・構造を表す（見た目ベース命名禁止）
    summary: >-
      クラス名は要素の役割・意味・構造を表す。見た目・装飾ベースの命名
      （.column-6, .red, .text-large, .margin20, .floated 等）は禁止。
    rationale: デザイン変更時にHTMLを触らずに済ませ、スタイルと命名のズレを防ぐため。
    aiGuidance: >-
      クラス名は「何であるか（役割・意味・構造）」で付ける。色・サイズ・余白・
      レイアウト値など見た目を表す語（red, large, column-6, margin20, floated 等）を
      名前に使わない。linter では捕まえられないため生成時に必ず自分で守る。

  CSS-PROHIBIT-001:
    title: IDセレクタでのスタイル指定禁止
    summary: "#id によるスタイル指定を禁止。クラスで表現する。"
    rationale: 詳細度の暴走を避け、上書き事故を防ぐため。
    aiGuidance: スタイル指定は必ずクラスで行う。ID セレクタ（#foo）をスタイルに使わない。

  CSS-PROHIBIT-002:
    title: リセット/例外以外でタグセレクタ禁止
    summary: >-
      リセットCSSと明示的例外を除き、タグ（型）セレクタでのスタイル指定を禁止。
      `.foo ul` や `ul.foo li` のような型セレクタ結合も禁止。例外: マークダウン
      パーサ出力などクラス付与不能な箇所は、親クラス配下に限りタグ指定可。
    rationale: 型セレクタは影響範囲が広く、上書き事故を招くため。
    aiGuidance: >-
      要素にはクラスを付けてスタイルする。タグ名（ul, li, a 等）で直接スタイルしない。
      リセットや markdown 出力などクラスを付けられない箇所だけ、親クラス配下でタグ指定する。

  CSS-PROHIBIT-003:
    title: "@layer / @scope は基本使用禁止"
    summary: "@layer・@scope を原則禁止（規約遵守なら不要。外部ライブラリ前提時のみ例外）。"
    rationale: 規約の詳細度・分割方針で不要になるため、覚えることを減らす。
    aiGuidance: "@layer / @scope を書かない。詳細度は規約のファイル分割・命名で管理する。"
    good: |
      /* @layer / @scope は使用しない */

  CSS-FILE-001:
    title: クラス名の先頭部＝ファイル名に一致【超重要】
    summary: >-
      _header.css には .header および .header-*（先頭部が header）で始まるクラスのみを
      記述する。ファイル名と先頭部（最初のハイフンまで）が一致しないクラス定義を禁止。
    rationale: クラス名を見た瞬間に定義ファイルが判明し、重複定義による上書き事故を防ぐ（規約の中核）。
    aiGuidance: >-
      新規クラスはそのファイル名の先頭部で始める。_header.css では .header または
      .header-* のみ定義し、別モジュール名（.my-awesome-header 等）で書き始めない。
      `.g-` / `.x-` / `.mode-` 接頭辞クラスと _g.css / _v.css は対象外。

  CSS-FILE-002:
    title: "@keyframes 名もファイル名に合わせる"
    summary: >-
      @keyframes 等アニメーション名を含む全ての命名を、そのファイル名（＝クラス先頭部）と
      連動させる。
    rationale: 命名からファイル位置を辿れる原則をアニメーション名にも一貫適用するため。
    aiGuidance: >-
      @keyframes 名もファイル名の先頭部で始める。_header.css なら header-fade-in のように
      付け、fadeIn のようなファイル名非連動の名前にしない。

  CSS-PREFIX-001:
    title: "グローバルクラスは .g-、_g.css に置く"
    summary: >-
      複数箇所で上書きして使い回すグローバルクラスは .g- 接頭辞にし、_g.css に定義する。
      _g.css 以外で .g- をスタイル対象となる主語 compound に置けるのは、ローカルクラス内の
      子側主語として1階層ネストする場合だけ。ローカルクラスが主語なら、.g- は文脈や
      pseudo-class の引数として参照できる。単純に再利用するだけの共通要素は要素名命名にする。
    rationale: 「編集に注意が必要な共有物」を接頭辞とファイルで可視化するため。
    aiGuidance: >-
      使い回すグローバルクラスだけ .g- を付け、必ず _g.css に定義する。_g.css 以外で
      .g- をスタイル対象のルート主語に新規定義しない。例外はローカルクラス内の子側主語としての
      1階層ネストだけ。ローカルクラスが主語なら .g- は文脈や pseudo-class の引数にだけ参照できる。
      単なる共通要素は要素名（.header- 等）で命名する。
    bad: |
      /* _header.css */
      .g-btn { … }   /* _g.css 以外での .g- 定義 */

  CSS-PREFIX-002:
    title: JS用クラス .x- はCSSでスタイル指定禁止
    summary: JS操作用クラスは .x- 接頭辞にし、CSS側でスタイル（宣言ブロック）を持たせない。
    rationale: JS操作対象とCSSスタイル対象を分離し、意図しないスタイル変更を防ぐため。
    aiGuidance: >-
      .x- クラスは JS のフック専用。CSS で .x- に宣言（color 等）を付けない。
      スタイルは別の意味クラスに書く。
    good: |
      /* スタイルは非 .x- クラスで */
      .list-item { color: red; }

  CSS-PREFIX-003:
    title: JS用IDは x 始まりcamelCase、CSSで使用禁止
    summary: JS用IDは xSomeElement のように x 始まり camelCase で命名し、CSS側では使用しない。
    rationale: JS参照点をCSSから分離し、命名で用途を明示するため。
    aiGuidance: >-
      JS用ID は xSomeElement のように x 始まり camelCase で付ける。CSS からは ID を
      一切参照しない（CSS側のID禁止は CSS-PROHIBIT-001 が担保）。命名自体は HTML/JS 側の規約。
    good: |
      <!-- HTML/JS側 -->
      <div id="xSomeElement"></div>
    bad: |
      #xSomeElement { color: red; }  /* CSS側での使用 */

  CSS-PREFIX-004:
    title: .mode- は他クラスへの連結形式のみ（単独/子孫単独禁止）
    summary: >-
      状態・バリエーション用 .mode- クラスはファイル名一致不要だが単独使用禁止。必ず他クラスに
      連結（.my-btn.mode-disabled、または .my-btn { &.mode-disabled {} }）して使う。
      子孫セレクタ内での単独 .mode- も禁止。
    rationale: 状態クラスを必ず対象クラスに束ね、どの要素の状態かを明示するため。
    aiGuidance: >-
      .mode- は必ず対象クラスと同一 compound で連結する（.btn.mode-active など）。
      .mode- 単独や子孫としての単独（.parent .mode-x）で書かない。

  CSS-NEST-001:
    title: ネスト原則禁止・許可時も1階層まで
    summary: >-
      セレクタのネストは基本禁止。必要な場合に限り1階層のみ許可。多段（.a .b .c）や
      多子ネストは禁止。
    rationale: 詳細度と可読性を保ち、定義の追跡を容易にするため。
    aiGuidance: ネストは原則使わない。使う場合も1階層まで。多段結合子や多子ネストを書かない。

  CSS-NEST-002:
    title: 別ファイル定義クラスのネスト上書き禁止
    summary: >-
      ネストによる上書きは「ローカルクラス内で子側主語にする .g- グローバルクラス」と
      「同一ファイル内の既存クラス上書き」のみ許可。別ファイルで定義されたクラスをネストで
      上書きするのは禁止。
    rationale: ファイル横断の暗黙上書きを禁じ、CSS-FILE-001 の「定義ファイルが自明」原則を守るため。
    aiGuidance: >-
      ネスト上書きの対象は、同じファイルの先頭部を持つクラスか、ローカルクラス内で子側主語に
      する .g- グローバルクラスに限る。.g- の状態変更は .g-btn:hover や .g-btn.mode-active の
      ように子側の同じ compound に書く。ローカルクラスが主語なら .g- は文脈や pseudo-class の
      引数にだけ参照できる。別ファイル由来のクラス（例 _card.css から .header-*）をネストで
      上書きしない。
    good: |
      /* _card.css（同ファイル） */
      .card { .card-alt & { … } }
      .card { .g-btn.mode-active { … } }
    bad: |
      /* _card.css */
      .g-btn { .special & { … } }  /* .g- をルートに置かない */
      .header-nav { … }   /* 別ファイル定義（_header.css）を上書き */

  CSS-NEST-003:
    title: ネスト時は親をセレクタ側、子側で親参照して集約
    summary: >-
      ネスト上書きは「親セレクタの中に子を書く」のではなく、子クラスの定義側で `.parent &` の
      ように親を参照し、関連スタイルを子の定義箇所に集約する。ネストした規則の主語（末尾の
      compound）には `&` を含める。非 _g.css のローカルクラス内で子側主語にする .g- は例外。
      `&.mode-x`、pseudo-class 等の自己参照は許可する。
    rationale: 子要素に関する定義を1箇所へ集め、探索性を高めるため。
    aiGuidance: >-
      ある要素のスタイルは、その要素のクラス定義に集約する。親の中に子定義を書くのではなく、
      子側で `.parent &` と親を参照して書く。例外の .g- 子ネストでも状態は .g-btn:hover や
      .g-btn.mode-active のように同じ compound に置き、さらに `&` をネストしない。主語に `&` が
      あるかは Stylelint が検査するが、同一クラスの関連スタイルを1箇所に集める配置までは、
      生成・レビュー時に自分で守る。

  CSS-VAR-001:
    title: Custom Property 名はケバブケース
    summary: CSS変数（Custom Property）名は全小文字ハイフン区切り。snake_case・camelCase 禁止。
    rationale: 命名記法をクラスと揃え、揺れをなくすため。
    aiGuidance: Custom Property 名は kebab-case で書く（--base-margin）。--v- 接頭辞もこの形式に従う。

  CSS-VAR-002:
    title: "グローバル変数は _v.css の :root に --v- で定義"
    summary: >-
      グローバル変数は _v.css に記述し、--v- 接頭辞、:root セレクタで定義する。逆に --v- 変数は
      _v.css の :root 以外で新規定義しない（モジュール側での参照は可）。
    rationale: グローバル変数の定義箇所を一意に固定し、上書き源を明確化するため。
    aiGuidance: >-
      --v- はグローバル専用。定義は _v.css の :root だけに置く。他ファイルやモジュール内で
      --v- を新規定義しない（参照 var(--v-…) は可）。
    bad: |
      /* _header.css */
      :root { --v-color-text: #333; }   /* _v.css 以外での --v- 定義 */

  CSS-VAR-003:
    title: 変数名もファイル名と一致
    summary: >-
      _header.css に定義するモジュール変数は --header-*（先頭部＝ファイル名）のみ。
      --v-（グローバル）を除く。
    rationale: 変数名からも定義ファイルを辿れるようにするため。
    aiGuidance: >-
      モジュール変数名はファイル名の先頭部で始める（_header.css なら --header-*）。
      --v- グローバル変数はこの対象外。

  CSS-VAR-004:
    title: モジュール変数はファイル名同名クラス内に定義
    summary: >-
      モジュール単位の変数は :root ではなく、ファイル名と同名のクラス（_header.css なら .header）
      の中に定義する。--v- グローバル変数はモジュール内で定義しない（採用決定: --v- は _v.css/:root 専用）。
    rationale: 変数のスコープを対象モジュールに閉じ、影響範囲を限定するため。
    aiGuidance: >-
      モジュール変数はファイル同名クラス（.header）のブロック内に定義し、:root には置かない。
      モジュール内で --v- 接頭辞の変数を定義しない（--v- は _v.css の :root 専用＝CSS-VAR-002）。
    bad: |
      /* _header.css */
      :root { --header-color-text: #333; }
      .header { --v-header-height: 30px; }   /* モジュール内での --v- 定義は違反 */

  CSS-VAR-005:
    title: 変数名は「prefix > 種別 > 細分類」の順
    summary: >-
      変数名の構成順は 接頭辞 > 種別（color/font/height 等） > 細分類。
      例: --v-color-text, --v-height-header。
    rationale: 変数名の並びを規則化し、補完・一覧性を高めるため。
    aiGuidance: >-
      変数名は「接頭辞 > 種別 > 細分類」で組む。種別語（color/font/height 等）を第2セグメントに
      置く（--v-color-text であって --v-text-color ではない）。linter 対象外なので生成時に守る。
    bad: |
      --v-text-color: #333;   /* 種別と細分類が逆 */

  CSS-RESP-001:
    title: "@custom-media 定義 + ネスト @media で指定"
    summary: >-
      ブレークポイントは @custom-media --v-screen-xs (width <= 360px); のように定義し、各クラス内に
      ネストした @media (--v-screen-xs) { … } で指定する。同一クラスのレスポンシブ指定は同一箇所に集約。
    rationale: ブレークポイントを変数化して一元管理し、レスポンシブ定義を対象クラスに集約するため。
    aiGuidance: >-
      ブレークポイントは @custom-media で --v-screen-* として定義し、参照する。生のメディア特性
      （max-width: 360px 等）を直書きせず、レスポンシブ指定は対象クラス内にネストして集約する。
      root 直下の @media 配置は CSS-RESP-002 が Stylelint で検査する。
    bad: |
      @media (max-width: 360px) {
        .some-class { color: green; }   /* 生の値・クラス外定義 */
      }

  CSS-RESP-002:
    title: "@media はクラス内にネストし、ファイル root 直下に書かない"
    summary: >-
      `@media` は対象クラスの規則ブロック内にネストして書く。CSS ファイルの root の直接の子として
      `@media` を置くのは禁止。root 直下の `@custom-media` は許可する。at-rule ラッパ内の @media、
      breakpoint名、raw media feature、同一クラス内の集約位置は検査しない。
    rationale: レスポンシブ定義を対象クラスに集約し、クラス外に散らばる上書きをなくすため。
    aiGuidance: >-
      @media は対象クラス内にネストし、root 直下に書かない。root 直下には @custom-media 定義を置ける。
      breakpointの命名・生値禁止・同一クラス内での集約は CSS-RESP-001 を参照する。
    bad: |
      @media (--v-screen-xs) {
        .some-class { color: green; }   /* root 直下の @media */
      }

  CSS-JS-001:
    title: JSからのスタイル変更は .mode- 付与で行う
    summary: >-
      JS側でのスタイル変更は .mode- クラスの付け外しで行う。.show() / .css({...}) /
      汎用 addClass('show') による直接スタイル操作は禁止。
    rationale: スタイル制御をCSSの .mode- 定義に集約し、JSに散らさないため。
    aiGuidance: >-
      JS からスタイルを変えるときは .mode- クラスを付け外しする。.show()/.hide()/.css() や
      汎用的な addClass('show') で直接スタイルを操作しない。JS側の規約なので CSS linter 対象外。
